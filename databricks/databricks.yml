bundle:
  name: procureflow
variables:
  cluster_id:
    description: Explicit existing development cluster; no compute is created by this bundle.
  landing_path:
    description: Complete batch path accessible to the configured cluster identity.
  bronze_path:
    description: Delta output root accessible to the configured cluster identity.
resources:
  jobs:
    bronze:
      name: procureflow-bronze
      max_concurrent_runs: 1
      timeout_seconds: 1200
      tasks:
        - task_key: ingest
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: src/bronze/ingest.py
            base_parameters:
              landing_path: ${var.landing_path}
              bronze_path: ${var.bronze_path}
targets:
  dev:
    default: true
    mode: development
