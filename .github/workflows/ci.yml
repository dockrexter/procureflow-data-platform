name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sftp/requirements.txt
      - run: python scripts/publish_sftp.py --help
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_definitions.py
      - run: az bicep build --file infrastructure/bicep/main.bicep --outfile /tmp/procureflow-arm.json
